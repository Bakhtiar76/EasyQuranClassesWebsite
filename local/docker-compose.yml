# Easy Quran Classes — local WordPress development stack.
#
# Local-only. Never point this compose file, or the site it starts,
# at production. See ../CLAUDE.md and ../CPANEL-WORKFLOW.md.
#
# Usage: docker compose -f local/docker-compose.yml up -d
#        docker compose -f local/docker-compose.yml run --rm wpcli <wp-cli args>
#   or:  local/wp.ps1 <wp-cli args>

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - eqc_db:/var/lib/mysql
    networks: [eqc]

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - eqc_wp:/var/www/html
      - ../wp-content/themes/easy-quran-classes-child:/var/www/html/wp-content/themes/easy-quran-classes-child
    networks: [eqc]

  # One-shot WP-CLI runner sharing the WordPress volume. Use via
  # `docker compose run --rm wpcli <args>` (or local/wp.ps1) — it is not a
  # long-running service.
  wpcli:
    image: wordpress:cli-php8.2
    depends_on: [db, wordpress]
    # wordpress:cli-php8.2 is Alpine-based (www-data=82); wordpress:php8.2-apache
    # is Debian-based (www-data=33) and owns the shared eqc_wp volume. Without
    # this, wp-cli can't write uploads/plugins the Apache container just made.
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
    volumes:
      - eqc_wp:/var/www/html
      - ../wp-content/themes/easy-quran-classes-child:/var/www/html/wp-content/themes/easy-quran-classes-child
      - ./backups:/backups
    networks: [eqc]
    entrypoint: ["wp", "--path=/var/www/html"]

volumes:
  eqc_wp:
  eqc_db:

networks:
  eqc:
